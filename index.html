<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galleria 40 – Soft Services</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#14201f;--mut:#6b7270;--in:#f4f1ea;--bd:#e2ddd0;--hd:#0f2a2a;--ac:#1a8a6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2321;--ink:#eee;--mut:#9aa5a2;--in:#26302d;--bd:#33403c;--hd:#0a1514}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2321;--ink:#eee;--mut:#9aa5a2;--in:#26302d;--bd:#33403c;--hd:#0a1514}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:230px;background:var(--hd);color:#fff;padding:16px 10px;flex-shrink:0}
nav h1{font-size:17px;margin:4px 8px 14px}nav button{display:block;width:100%;text-align:right;background:none;border:0;color:#cfe0dc;padding:9px 12px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
nav button.on,nav button:hover{background:var(--ac);color:#fff}
main{flex:1;padding:20px;min-width:0}
.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px #0001}
.card h2{font-size:17px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:10px 26px;font:inherit;font-weight:700;cursor:pointer;margin-top:12px}
.btn.s{background:var(--in);color:var(--ink);padding:6px 12px;margin:0;font-size:12px}
.tw{overflow-x:auto;border-radius:14px}table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{background:var(--hd);color:#fff;padding:12px;text-align:right}td{padding:10px 12px;border-bottom:1px solid var(--bd)}
.em{text-align:center;color:var(--mut);padding:22px}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;padding:7px 0}.chk input{width:auto}
.vt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.vt button{border:1px solid var(--bd);background:var(--in);color:var(--ink);padding:6px 14px;border-radius:20px;font:inherit;cursor:pointer}.vt button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px}nav h1{display:none}nav button{white-space:nowrap;width:auto}}
input[type=checkbox]{width:auto}h3{margin:16px 0 8px}
.lw{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bgimg,none),radial-gradient(circle at 15% 20%,#cfe3dc 0,transparent 45%),radial-gradient(circle at 85% 80%,#d7dcef 0,transparent 45%),#f4f1ea;background-size:cover;background-position:center}
.app.login main{padding:0}.app.login nav{display:none}
.lc{background:#fff;color:#14201f;border-radius:22px;padding:28px;width:100%;max-width:400px;box-shadow:0 10px 40px #0002}
.lc input{background:#f4f1ea;color:#14201f}.lc label{color:#6b7270}.lc h2{text-align:center}.err{color:#c0392b;min-height:18px;margin:8px 0 0;font-size:13px}
.lg1{display:block;margin:0 auto 10px;width:190px}
.ft{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:22px;padding-top:14px;border-top:1px solid #e2ddd0;font-size:12px;color:#6b7270}.ft img{height:36px}
.chip{background:#fff;border-radius:12px;padding:8px 10px;margin:0 6px}.chip img{display:block;width:100%;max-height:70px;object-fit:contain}
.who{font-size:12px;padding:8px 12px 12px;color:#9fe0cc}.who a{color:#fff}
@media(max-width:760px){.logo{display:none}.who{white-space:nowrap}}
.ttl{font-weight:700;font-size:18px;padding:8px 12px 0}.ttl small{display:block;font-weight:400;font-size:12px;color:#9fe0cc}

.bd{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700}.bd.ok{background:#d9f2e6;color:#0b6b43}.bd.no{background:#fde0dd;color:#a5281b}.bd.wt{background:#fff0d1;color:#8a5a00}
.btn.s.ok{background:#d9f2e6;color:#0b6b43}.btn.s.no{background:#fde0dd;color:#a5281b}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:16px}
.st{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 4px #0001}.st small{color:var(--mut);font-weight:700}.st .n{font-size:30px;font-weight:700;margin:4px 0}
.bar{height:8px;background:var(--in);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tc{background:var(--card);border-radius:16px;padding:14px;border-right:6px solid #e0a100;box-shadow:0 1px 4px #0001;display:flex;flex-direction:column;gap:8px}.tc.d{border-right-color:#1a8a6a}.tc.n{border-right-color:#c0392b}.tc h4{margin:0;font-size:15px}.tc p{margin:0;color:var(--mut);font-size:13px}
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.kc{background:var(--in);border:1px solid var(--bd);border-radius:14px;padding:12px}
.kc .en{font-weight:700;font-size:13.5px;direction:ltr;text-align:left}.kc .ar{color:var(--mut);font-size:12.5px;margin:2px 0 8px}.kc .ip{display:flex;gap:8px;align-items:center}.kc .u{font-size:12px;color:var(--mut);white-space:nowrap}.kc input{background:var(--card)}
details summary{cursor:pointer;font-size:15px}details.card{padding:14px 20px}
.rs{padding:4px 2px;width:50px;border-radius:8px;text-align:center}.rs.s1{background:#fff0d1}.rs.s2{background:#dbe8ff}.rs.s3{background:#e3e3ea;color:#222}.rs.s4{background:#fde0dd}.rs.s5{background:#ecdcf7;color:#222}

/* تصميم ١: كلاسيك هادئ */
nav button.on{background:#c7a566;color:#14201f;font-weight:700}nav button:hover{background:#17403f;color:#fff}nav button.on:hover{background:#c7a566;color:#14201f}
.ttl small{color:#c7a566}.who{color:#c7a566}.who a{color:#fff}nav{width:240px}
.card,.st,.tc{border:1px solid #e6e0d2;box-shadow:none;border-radius:20px}.st .n{font-size:38px}
.hero{background:#0f2a2a;color:#fff;border-radius:20px;padding:22px 26px;margin-bottom:16px}.hero .bd.wt{background:#c7a566;color:#14201f}
</style></head><body>

function applies(p,day){if(!p.active||p.start_date>day||(p.end_date&&p.end_date<day))return false;const d=new Date(day+"T00:00:00");

if(ids.length)(await rows(sb.from("task_logs").select("*").eq("day",day).in("plan_id",ids))).forEach(l=>L[l.plan_id]=l);return{pl,L}}

R.sort((a,c)=>a[0]<c[0]?-1:a[0]>c[0]?1:a[2]<c[2]?-1:1);sum=`${R.length} مهمة · تم ${dn} · لم يتم ${nd} · منتظر ${pn}`;RP.push({t:"المهام",head:["التاريخ","المهمة","الميعاد","الوردية","المُسند","الحالة","السبب","بواسطة"],rows:R});
if(rt=="pest"){const r=(await recs("pestinc")).filter(inR).sort(srt);RP.push({t:"بلاغات الإصابات",head:["التاريخ","المكان","المُبلّغ","النوع","الوصف","الحالة"],rows:r.map(x=>[x.date,x.area,x.rep,x.type,x.note,x.st])});sum+=` · بلاغات إصابات ${r.length}`}}
else if(rt=="scent"){const r=(await recs("scent")).filter(inR).sort(srt);sum=`${r.length} تقرير`;RP.push({t:"فحص المعطرات",head:["التاريخ","الوردية","البنود السليمة","ملاحظات","بواسطة"],rows:r.map(x=>[x.date,x.shift,x.ok+"/"+SC.length,x.note||"",x.by||""])})}
else if(rt=="cmp"){const r=(await recs("cmp")).filter(inR).sort(srt);sum=`${r.length} شكوى · غير محلولة ${r.filter(x=>x.st!="تم الحل").length}`;RP.push({t:"الشكاوي",head:["التاريخ","المكان","الوصف","الحالة","المسؤول","ملاحظات"],rows:r.map(x=>[x.date,x.area,x.what,x.st,x.by,x.note||""])})}
else if(rt=="kpi"){const d=(await rows(sb.from("kpi").select("*").eq("vendor",rv).gte("day",rf).lte("day",rto).order("day"))),it=V[rv];sum=`${rv} · ${VN[rv][0]} · أيام التقييم: ${d.length}`;
RP.push({t:"الملخص",head:["Item","البند","القيمة","الحساب"],rows:it.map((x,i)=>{const a=d.map(z=>z.v&&z.v[i]).filter(z=>z!=null);let val="–";if(a.length){const t=a.reduce((p,c)=>p+c,0);val=x[2]=="n"?+t.toFixed(2):+(t/a.length).toFixed(1)}return[x[0],x[1],val,x[2]=="n"?"مجموع":"متوسط"]})});
RP.push({t:"التفاصيل اليومية",head:["Date",...it.map(x=>x[0])],rows:d.map(z=>[z.day,...it.map((x,i)=>z.v&&z.v[i]!=null?z.v[i]:"")])})}
const cl=c=>c=="تم"?'<span class="bd ok">تم</span>':c=="لم يتم"?'<span class="bd no">لم يتم</span>':c=="منتظر"?'<span class="bd wt">منتظر</span>':esc(c);
b.innerHTML=`<div class="card"><b>${sum}</b> <span style="color:var(--mut)">(من ${rf} إلى ${rto})</span></div>`+xh+RP.map(t=>`<div class="card" style="padding:0"><div style="padding:14px 20px 0;font-weight:700">${t.t} (${t.rows.length})</div><div class="tw"><table><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.rows.length?t.rows.map(r=>`<tr>${r.map(c=>`<td>${cl(c)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${t.head.length}" class="em">لا توجد بيانات في هذه الفترة</td></tr>`}</tbody></table></div></div>`).join("")}
function csv(){const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';const o=RP.map(t=>[q(t.t),t.head.map(q).join(","),...t.rows.map(r=>r.map(q).join(","))].join("\n")).join("\n\n");const u=URL.createObjectURL(new Blob(["\ufeff"+o],{type:"text/csv"}));const a=document.createElement("a");a.href=u;a.download="report-"+rt+"-"+rf+"_"+rto+".csv";a.click()}
// ---------- توزيع الورديات ----------
let rm=today().slice(0,7);const RSH=["صباحي","مسائي","ليلي","إجازة","إجازة سنوية"],RSC={"صباحي":"ص","مسائي":"م","ليلي":"ل","إجازة":"إ","إجازة سنوية":"س"};
async function rosterS(m){const[y,mo]=rm.split("-").map(Number),n=new Date(y,mo,0).getDate(),first=rm+"-01",last=rm+"-"+String(n).padStart(2,"0");
const sup=await rows(sb.from("profiles").select("id,name").eq("role","supervisor").eq("active",true).order("name"));const R={};(await rows(sb.from("roster").select("*").gte("day",first).lte("day",last))).forEach(x=>R[x.user_id+"_"+x.day]=x.shift);
const days=[...Array(n).keys()].map(i=>i+1);
m.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">توزيع الورديات الشهري</h2><div><input type="month" value="${rm}" onchange="rm=this.value||rm;render()"></div></div><p style="color:var(--mut);margin:8px 0 0">ص = صباحي · م = مسائي · ل = ليلي · إ = إجازة · س = إجازة سنوية. اختار الوردية لكل يوم، أو استخدم "املأ الشهر". الورديات دي هي اللي بتحدد القوائم والمهام اللي بتظهر للمشرف.</p></div>
<div class="card" style="padding:0"><div class="tw"><table style="min-width:${200+n*58}px"><thead><tr><th style="min-width:210px">المشرف</th>${days.map(d=>`<th style="text-align:center;padding:8px 4px">${d}<br><small>${DAYS[new Date(y,mo-1,d).getDay()].slice(0,3)}</small></th>`).join("")}</tr></thead><tbody>${sup.length?sup.map(u=>`<tr><td><b>${esc(u.name)}</b><div class="row" style="margin-top:6px;gap:6px"><select id="bf_${u.id}" class="rs" style="width:78px">${RSH.map(x=>`<option>${x}</option>`).join("")}<option value="">مسح</option></select><button class="btn s" onclick="fillR('${u.id}')">املأ الشهر</button></div></td>${days.map(d=>{const day=rm+"-"+String(d).padStart(2,"0"),v=R[u.id+"_"+day]||"";return`<td style="padding:4px"><select class="rs s${RSH.indexOf(v)+1}" onchange="setR('${u.id}','${day}',this)"><option value=""></option>${RSH.map(x=>`<option value="${x}" ${v==x?"selected":""}>${RSC[x]}</option>`).join("")}</select></td>`}).join("")}</tr>`).join(""):`<tr><td colspan="${n+1}" class="em">لا يوجد مشرفين – أضفهم من شاشة المستخدمين</td></tr>`}</tbody></table></div></div>`}
async function setR(uid,day,el){const v=el.value;el.className="rs s"+(RSH.indexOf(v)+1);const r=v?await sb.from("roster").upsert({user_id:uid,day,shift:v}):await sb.from("roster").delete().eq("user_id",uid).eq("day",day);if(r.error)alert("تعذّر الحفظ: "+r.error.message)}
async function fillR(uid){const v=$("#bf_"+uid).value,[y,mo]=rm.split("-").map(Number),n=new Date(y,mo,0).getDate();let r;
if(v)r=await sb.from("roster").upsert([...Array(n).keys()].map(i=>({user_id:uid,day:rm+"-"+String(i+1).padStart(2,"0"),shift:v})));
else r=await sb.from("roster").delete().eq("user_id",uid).gte("day",rm+"-01").lte("day",rm+"-"+String(n).padStart(2,"0"));
if(r.error)return alert("تعذّر الحفظ: "+r.error.message);render()}
// ---------- المستخدمين (دور فقط) ----------
async function usr(m){m.innerHTML=`<div id="u_f"></div><div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">المستخدمين</h2><button class="btn" style="margin:0" onclick="openU()">+ مستخدم جديد</button></div><p style="color:var(--mut);margin:8px 0 0">الصلاحيات حالياً حسب الدور: <b>الإدارة</b> (كل شيء) أو <b>مشرف</b> (التنفيذ والتسجيل اليومي). التفاصيل الدقيقة هتتضاف بعد ما تحددها.</p></div><div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>الاسم</th><th>الإيميل</th><th>الدور</th><th>وردية اليوم</th><th>الحالة</th><th></th></tr></thead><tbody id="u_t"></tbody></table></div></div>`;await loadU()}
async function loadU(){UL=await rows(sb.from("profiles").select("*").order("created_at"));const RO={};(await rows(sb.from("roster").select("user_id,shift").eq("day",today()))).forEach(x=>RO[x.user_id]=x.shift);$("#u_t").innerHTML=UL.map(u=>`<tr><td>${esc(u.name)}</td><td dir="ltr">${esc(u.email)}</td><td>${bd(u.role=="admin"?"ok":"wt",RL(u.role))}</td><td>${u.role=="admin"?"–":(RO[u.id]||"غير محددة")}</td><td>${u.active?"مفعّل":"موقوف"}</td><td><button class="btn s" onclick="openU('${u.id}')">تعديل</button> ${u.id==me.id?"":`<button class="btn s" style="color:#c0392b" onclick="delU('${u.id}')">حذف</button>`}</td></tr>`).join("")}
function openU(id){const u=UL.find(x=>x.id==id)||{name:"",email:"",role:"supervisor",active:true},ed=!!id;
$("#u_f").innerHTML=`<div class="card"><h2>${ed?"تعديل مستخدم":"مستخدم جديد"}</h2><div class="grid"><div><label>الاسم</label><input id="u_n" value="${esc(u.name)}"></div><div><label>الإيميل</label><input id="u_e" dir="ltr" value="${esc(u.email)}" ${ed?"disabled":""}></div><div><label>${ed?"كلمة مرور جديدة (اختياري)":"كلمة المرور (6 أحرف على الأقل)"}</label><input id="u_p" type="password" dir="ltr"></div><div><label>الدور</label><select id="u_r"><option value="supervisor" ${u.role=="supervisor"?"selected":""}>مشرف</option><option value="admin" ${u.role=="admin"?"selected":""}>الإدارة</option></select></div><div><label>الحالة</label><select id="u_a"><option value="1" ${u.active?"selected":""}>مفعّل</option><option value="0" ${u.active?"":"selected"}>موقوف</option></select></div></div><button class="btn" onclick="saveU('${id||""}')">حفظ</button> <button class="btn s" onclick="$('#u_f').innerHTML=''">إلغاء</button></div>`;window.scrollTo(0,0)}
async function saveU(id){const g=i=>$("#"+i).value.trim(),row={name:g("u_n"),role:$("#u_r").value,active:$("#u_a").value=="1"};if(!row.name)return alert("اكتب الاسم");let uid=id;
if(!id){const em=g("u_e"),pw=$("#u_p").value;if(!em||pw.length<6)return alert("اكتب الإيميل وكلمة مرور 6 أحرف على الأقل");const c=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});const r=await c.auth.signUp({email:em,password:pw,options:{data:{name:row.name}}});if(r.error)return alert("تعذّر إنشاء المستخدم: "+r.error.message);if(!r.data.user||(r.data.user.identities&&r.data.user.identities.length===0))return alert("الإيميل مستخدم بالفعل");uid=r.data.user.id}
else if($("#u_p").value){if($("#u_p").value.length<6)return alert("كلمة المرور قصيرة");const r=await sb.rpc("admin_set_password",{uid:id,pw:$("#u_p").value});if(r.error)return alert("تعذّر تغيير كلمة المرور: "+r.error.message)}
const u=await sb.from("profiles").update(row).eq("id",uid);if(u.error)return alert("تعذّر الحفظ: "+u.error.message);$("#u_f").innerHTML="";loadU()}
async function delU(id){if(!confirm("حذف المستخدم نهائياً؟"))return;const r=await sb.rpc("admin_delete_user",{uid:id});if(r.error)return alert("تعذّر الحذف: "+r.error.message);loadU()}
// ---------- الدخول ----------
function loginUI(msg){$(".app").classList.add("login");$("#main").innerHTML=`<div class="lw"><div class="lc"><img class="lg1" src="${IMG_G}"><h2>تسجيل الدخول</h2><label>البريد الإلكتروني</label><input id="l_e" type="email" dir="ltr"><div style="height:10px"></div><label>كلمة المرور</label><input id="l_p" type="password" dir="ltr" onkeydown="if(event.key=='Enter')login()"><p class="err">${msg||""}</p><button class="btn" style="width:100%;margin-top:6px" onclick="login()">دخول</button><div class="ft"><span>إدارة المرافق</span><img src="${IMG_R}"></div></div></div>`}
async function login(){const r=await sb.auth.signInWithPassword({email:$("#l_e").value.trim(),password:$("#l_p").value});if(r.error)return loginUI("بيانات الدخول غير صحيحة");boot()}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return loginUI();
const p=await sb.from("profiles").select("*").eq("id",session.user.id).single();me=p.data;if(!me||!me.active){await sb.auth.signOut();return loginUI("الحساب غير مفعّل")}
isMgmt=me.role=="admin";$(".app").classList.remove("login");
const dk=matchMedia("(prefers-color-scheme: dark)").matches,ov=dk?"rgba(18,24,22,.82)":"rgba(244,241,234,.82)";document.body.style.background=`linear-gradient(${ov},${ov}),url(${IMG_B}) center/cover fixed`;cur="home";nav();render()}

boot();
