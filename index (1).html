<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galleria 40 – Soft Services</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#14201f;--mut:#6b7270;--in:#f4f1ea;--bd:#e2ddd0;--hd:#0f2a2a;--ac:#1a8a6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2321;--ink:#eee;--mut:#9aa5a2;--in:#26302d;--bd:#33403c;--hd:#0a1514}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2321;--ink:#eee;--mut:#9aa5a2;--in:#26302d;--bd:#33403c;--hd:#0a1514}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:230px;background:var(--hd);color:#fff;padding:16px 10px;flex-shrink:0}
nav h1{font-size:17px;margin:4px 8px 14px}nav button{display:block;width:100%;text-align:right;background:none;border:0;color:#cfe0dc;padding:9px 12px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
nav button.on,nav button:hover{background:var(--ac);color:#fff}
main{flex:1;padding:20px;min-width:0}
.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px #0001}
.card h2{font-size:17px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:10px 26px;font:inherit;font-weight:700;cursor:pointer;margin-top:12px}
.btn.s{background:var(--in);color:var(--ink);padding:6px 12px;margin:0;font-size:12px}
.tw{overflow-x:auto;border-radius:14px}table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{background:var(--hd);color:#fff;padding:12px;text-align:right}td{padding:10px 12px;border-bottom:1px solid var(--bd)}
.em{text-align:center;color:var(--mut);padding:22px}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;padding:7px 0}.chk input{width:auto}
.vt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.vt button{border:1px solid var(--bd);background:var(--in);color:var(--ink);padding:6px 14px;border-radius:20px;font:inherit;cursor:pointer}.vt button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px}nav h1{display:none}nav button{white-space:nowrap;width:auto}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const today=()=>new Date().toISOString().slice(0,10);
const SHIFTS=["صباحي","مسائي","ليلي"],ST=["تم","جاري","متأخر"];
const T={date:"التاريخ",shift:"الوردية",area:"المنطقة / الموقع",what:"وصف العمل",st:"الحالة",by:"المسؤول",note:"ملاحظات (اختياري)"};
const ops=(k,t,extra)=>({k,t,f:[["date","date"],["area","text"],["what","text"],...(extra||[]),["st","sel",ST],["by","text"],["note","area"]]});
const SCREENS=[
{k:"att",t:"الحضور",att:1},
ops("mep","أعمال التأسيسات"),ops("marble","أعمال جلي وتلميع الرخام"),ops("facade","أعمال الواجهات"),
ops("scent","أجهزة المعطرات"),ops("pest","مكافحة الحشرات"),ops("plants","أعمال الزراعة"),ops("gw","أعمال Green Wall"),
{k:"chk",t:"قوائم التحقق اليومية – فريق رايه",chk:1},
{k:"cmp",t:"الشكاوي",f:[["date","date"],["area","text"],["what","text"],["st","sel",["جديدة","قيد المعالجة","تم الحل"]],["by","text"],["note","area"]]},
{k:"kpi",t:"KPI اليومي",kpi:1},{k:"rep",t:"التقارير (أسبوعي/شهري/ربع سنوي)",rep:1}];
const CHK=["نظافة دورات المياه","توافر المستلزمات","نظافة الممرات","نظافة المداخل","إفراغ سلات المهملات","جاهزية المعدات"];
// KPI definitions: [label, kind] kind: p=% (avg), h=headcount (avg), n=sum
const V={
Geretex:[["Manpower vs contract (headcount)","h"],["Cleaning inspection score (%)","p"],["Restroom round completion (%)","p"],["Consumables availability (%)","p"],["Response to cleaning calls within SLA (%)","p"],["Complaints (no.)","n"],["HSE violations (no.)","n"]],
Linka:[["Elevations/drops completed vs plan (%)","p"],["Area cleaned (m2)","n"],["Work-at-height permits compliant (%)","p"],["Equipment & safety checks completed (%)","p"],["Weather/access delay (days)","n"],["Rework items (no.)","n"],["Complaints / HSE violations (no.)","n"]],
Secure:[["Scheduled treatments completed - PPM (%)","p"],["Bait/trap station checks completed (%)","p"],["Pest sightings reported (no.)","n"],["Call-out response within SLA (%)","p"],["Chemical logs & SDS on file (%)","p"],["Complaints / HSE violations (no.)","n"]],
Aroma:[["Maintenance schedule completed (%)","p"],["Irrigation checks completed (%)","p"],["Irrigation faults found (no.)","n"],["Plants replaced vs required (%)","p"],["Landscape condition score (%)","p"],["Manpower vs contract (headcount)","h"],["Complaints / HSE violations (no.)","n"]],
"Joy Scent":[["Machines operational / installed (%)","p"],["Refill & servicing vs schedule (%)","p"],["Downtime (hours)","n"],["Faulty units (no.)","n"],["Fault response within SLA (%)","p"],["Complaints / HSE violations (no.)","n"]],
"House Care":[["Area polished vs plan (%)","p"],["Deep-polish cycles completed vs schedule (%)","p"],["Floor condition score (%)","p"],["Area closures / works outside off-peak (no.)","n"],["Slip incidents or damage reports (no.)","n"],["Manpower vs contract (headcount)","h"],["Complaints / HSE violations (no.)","n"]],
Scheduf:[["Irrigation & pump uptime (%)","p"],["Maintenance visits completed - PPM (%)","p"],["Dead/unhealthy plants (% of wall area)","p"],["Plants replaced vs required (%)","p"],["Leaks / water damage incidents (no.)","n"],["Complaints / HSE violations (no.)","n"]],
"Al Safwa":[["Scheduled collections completed (%)","p"],["Missed or late pick-ups (no.)","n"],["Waste volume (tonnes)","n"],["Segregation / recycling compliance (%)","p"],["Bin overflow / odour complaints (no.)","n"],["Manpower & vehicles vs contract","h"],["HSE violations (no.)","n"]]};
let db=null,user=null,cur="att",unsub=null,isMgmt=true,vend="Geretex",rv="Geretex",per="week",kd=today(),ad=today();
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inp=(id,t,o,v)=>t=="sel"?`<select id="${id}">${o.map(x=>`<option>${x}</option>`).join("")}</select>`:t=="area"?`<textarea id="${id}"></textarea>`:`<input id="${id}" type="${t=="date"?"date":"text"}" value="${v??(t=="date"?today():"")}">`;
const num=(id,l)=>`<div><label>${l}</label><input id="${id}" type="number" min="0" value="0"></div>`;
function nav(){$("#nav").innerHTML="<h1>Galleria 40<br><small>Soft Services</small></h1>"+(me?`<div style="font-size:12px;padding:0 8px 10px;color:#9fc">${esc(me.name)} · ${me.role=="admin"?"الإدارة":"مشرف"} <a href="#" onclick="out();return false" style="color:#fff">خروج</a></div>`:"")+SCREENS.map(s=>`<button class="${s.k==cur?"on":""}" onclick="go('${s.k}')">${s.t}</button>`).join("")}
function go(k){cur=k;nav();render()}
let ch=null;
async function load(col,fn){let r;if(col=="kpi"){r=await sb.from("kpi").select("*");fn((r.data||[]).map(x=>({id:x.vendor+"_"+x.day,vendor:x.vendor,date:x.day,v:x.v,note:x.note,at:Date.parse(x.updated_at)})))}
else{r=await sb.from("records").select("id,data,created_at").eq("screen",col).order("created_at",{ascending:false}).limit(500);fn((r.data||[]).map(x=>({id:x.id,...x.data,at:Date.parse(x.created_at)})))}}
function sub(col,fn){if(ch){sb.removeChannel(ch);ch=null}load(col,fn);ch=sb.channel("c"+Math.random()).on("postgres_changes",{event:"*",schema:"public",table:col=="kpi"?"kpi":"records"},()=>load(col,fn)).subscribe()}
async function save(col,id,o){delete o.at;try{let r;if(col=="kpi")r=await sb.from("kpi").upsert({vendor:o.vendor,day:o.date,v:o.v,note:o.note,updated_at:new Date().toISOString()});else r=await sb.from("records").insert({screen:col,data:o});if(r.error)throw r.error;return true}catch(e){alert("تعذّر الحفظ: "+(e.message||e));return false}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function render(){const s=SCREENS.find(x=>x.k==cur),m=$("#main");
if(s.att)return att(m);if(s.chk)return chkS(m);if(s.kpi)return kpi(m);if(s.rep)return rep(m);return ops_(m,s)}
function att(m){m.innerHTML=`<div class="card"><h2>تسجيل حضور جديد</h2><div class="grid">
<div><label>التاريخ</label><input id="a_d" type="date" value="${today()}"></div>
<div><label>مرحلة المشروع</label><input id="a_p" value="المرحلة 1"></div>
<div><label>الوردية</label><select id="a_s">${SHIFTS.map(x=>`<option>${x}</option>`).join("")}</select></div>
${num("a_m","مدير موقع")}${num("a_a","إداري موقع")}${num("a_sr","مشرف أول")}${num("a_su","مشرف")}${num("a_w","عامل")}</div>
<div style="margin-top:14px"><label>ملاحظات (اختياري)</label><textarea id="a_n"></textarea></div>
<button class="btn" onclick="saveAtt()">حفظ</button></div>
<div class="card"><div style="max-width:220px"><label>عرض تاريخ</label><input type="date" id="a_v" value="${ad}" onchange="ad=this.value;attT()"></div></div>
<div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>المرحلة</th><th>الوردية</th><th>مدير موقع</th><th>إداري موقع</th><th>مشرف أول</th><th>مشرف</th><th>عامل</th></tr></thead><tbody id="a_t"></tbody></table></div></div>`;
sub("att",d=>{window._att=d;attT()})}
function attT(){const r=(window._att||[]).filter(x=>x.date==ad).sort((a,b)=>a.at-b.at);$("#a_t").innerHTML=r.length?r.map(x=>`<tr><td>${esc(x.p)}</td><td>${esc(x.s)}</td><td>${x.m}</td><td>${x.a}</td><td>${x.sr}</td><td>${x.su}</td><td>${x.w}</td></tr>`).join(""):`<tr><td colspan="7" class="em">لا توجد سجلات في هذا اليوم</td></tr>`}
async function saveAtt(){const g=i=>$("#"+i).value,n=i=>+g(i)||0;if(await save("att",uid(),{date:g("a_d"),p:g("a_p"),s:g("a_s"),m:n("a_m"),a:n("a_a"),sr:n("a_sr"),su:n("a_su"),w:n("a_w"),note:g("a_n"),by:user?await user.id():""})){ad=g("a_d");$("#a_v").value=ad;["a_m","a_a","a_sr","a_su","a_w"].forEach(i=>$("#"+i).value=0);$("#a_n").value=""}}
function ops_(m,s){m.innerHTML=`<div class="card"><h2>${s.t} – تسجيل جديد</h2><div class="grid">${s.f.filter(f=>f[1]!="area").map(f=>`<div><label>${T[f[0]]}</label>${inp("o_"+f[0],f[1],f[2])}</div>`).join("")}</div><div style="margin-top:14px"><label>${T.note}</label><textarea id="o_note"></textarea></div><button class="btn" onclick="saveOps('${s.k}')">حفظ</button></div>
<div class="card" style="padding:0"><div class="tw"><table><thead><tr>${s.f.map(f=>`<th>${T[f[0]]}</th>`).join("")}</tr></thead><tbody id="o_t"></tbody></table></div></div>`;
sub(s.k,d=>{$("#o_t").innerHTML=d.length?d.sort((a,b)=>b.at-a.at).map(x=>`<tr>${s.f.map(f=>`<td>${esc(x[f[0]])}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="9" class="em">لا توجد سجلات</td></tr>`})}
async function saveOps(k){const s=SCREENS.find(x=>x.k==k),o={};s.f.forEach(f=>o[f[0]]=f[1]=="area"?$("#o_note").value:$("#o_"+f[0]).value);if(await save(k,uid(),o)){s.f.forEach(f=>{if(f[1]=="text")$("#o_"+f[0]).value=""});$("#o_note").value=""}}
function chkS(m){m.innerHTML=`<div class="card"><h2>قائمة التحقق اليومية – فريق رايه</h2><div class="grid"><div><label>التاريخ</label><input id="c_d" type="date" value="${today()}"></div><div><label>الوردية</label><select id="c_s">${SHIFTS.map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>المشرف</label><input id="c_b"></div></div>
<div style="margin-top:10px">${CHK.map((x,i)=>`<label class="chk"><input type="checkbox" id="c_${i}"> ${x}</label>`).join("")}</div><textarea id="c_n" placeholder="ملاحظات"></textarea><button class="btn" onclick="saveChk()">حفظ</button></div>
<div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>التاريخ</th><th>الوردية</th><th>المشرف</th><th>المنجز</th><th>ملاحظات</th></tr></thead><tbody id="c_t"></tbody></table></div></div>`;
sub("chk",d=>{$("#c_t").innerHTML=d.length?d.sort((a,b)=>b.at-a.at).map(x=>`<tr><td>${x.date}</td><td>${esc(x.s)}</td><td>${esc(x.b)}</td><td>${x.n}/${CHK.length}</td><td>${esc(x.note)}</td></tr>`).join(""):`<tr><td colspan="5" class="em">لا توجد سجلات</td></tr>`})}
async function saveChk(){const n=CHK.filter((x,i)=>$("#c_"+i).checked).length;if(await save("chk",uid(),{date:$("#c_d").value,s:$("#c_s").value,b:$("#c_b").value,n,note:$("#c_n").value}))CHK.forEach((x,i)=>$("#c_"+i).checked=false)}
const vtabs=(cur,fn)=>`<div class="vt">${Object.keys(V).map(v=>`<button class="${v==cur?"on":""}" onclick="${fn}('${v}')">${v}</button>`).join("")}</div>`;
function kpi(m){const it=V[vend];m.innerHTML=`<div class="card"><h2>تقييم يومي للموردين</h2>${vtabs(vend,"setV")}<div style="max-width:220px;margin-bottom:12px"><label>التاريخ</label><input type="date" id="k_d" value="${kd}" onchange="kd=this.value;kpiLoad()"></div>
<div class="grid">${it.map((x,i)=>`<div><label>${x[0]}</label><input type="number" step="any" min="0" id="k_${i}"></div>`).join("")}</div><div style="margin-top:12px"><label>ملاحظات</label><textarea id="k_n"></textarea></div><button class="btn" onclick="saveK()">حفظ التقييم</button></div>`;
sub("kpi",d=>{window._k=d;kpiLoad(true)})}
function setV(v){vend=v;render()}
function kpiLoad(first){const r=(window._k||[]).find(x=>x.id==vend+"_"+kd);V[vend].forEach((x,i)=>{const e=$("#k_"+i);if(e&&(!first||!e.value))e.value=r?.v?.[i]??""});if($("#k_n"))$("#k_n").value=r?.note||""}
async function saveK(){const v=V[vend].map((x,i)=>$("#k_"+i).value===""?null:+$("#k_"+i).value);await save("kpi",vend+"_"+kd,{vendor:vend,date:kd,v,note:$("#k_n").value,by:user?await user.id():""})&&alert("تم الحفظ")}
function range(){const d=new Date(),y=d.getFullYear(),mo=d.getMonth();let s;if(per=="week"){s=new Date(d);s.setDate(d.getDate()-6)}else if(per=="month")s=new Date(y,mo,1);else s=new Date(y,Math.floor(mo/3)*3,1);return s.toISOString().slice(0,10)}
function rep(m){m.innerHTML=`<div class="card"><h2>تقرير المورد</h2>${vtabs(rv,"setR")}<div class="row"><div><label>الفترة</label><select id="r_p" onchange="per=this.value;repT()"><option value="week" ${per=="week"?"selected":""}>آخر 7 أيام</option><option value="month" ${per=="month"?"selected":""}>الشهر الحالي</option><option value="q" ${per=="q"?"selected":""}>الربع الحالي</option></select></div><button class="btn s" onclick="csv()">تنزيل ملف المورد CSV</button></div></div>
<div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>البند</th><th>القيمة</th><th>طريقة الحساب</th></tr></thead><tbody id="r_t"></tbody></table></div></div>`;
sub("kpi",d=>{window._k=d;repT()})}
function setR(v){rv=v;render()}
function calc(){const s=range(),r=(window._k||[]).filter(x=>x.vendor==rv&&x.date>=s);return{n:r.length,rows:V[rv].map((x,i)=>{const a=r.map(z=>z.v?.[i]).filter(z=>z!=null);if(!a.length)return[x[0],"–",x[1]];const t=a.reduce((p,c)=>p+c,0);return[x[0],x[1]=="n"?+t.toFixed(2):+(t/a.length).toFixed(1),x[1]=="n"?"مجموع":"متوسط"]})}}
function repT(){const c=calc();$("#r_t").innerHTML=c.n?c.rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td></tr>`).join(""):`<tr><td colspan="3" class="em">لا توجد تقييمات في هذه الفترة</td></tr>`}
function csv(){const rows=(window._k||[]).filter(x=>x.vendor==rv).sort((a,b)=>a.date<b.date?-1:1);const h=["Date",...V[rv].map(x=>'"'+x[0]+'"')].join(",");const body=rows.map(r=>[r.date,...r.v.map(x=>x??"")].join(",")).join("\n");const u=URL.createObjectURL(new Blob(["\ufeff"+h+"\n"+body],{type:"text/csv"}));const a=document.createElement("a");a.href=u;a.download=rv+"-KPI.csv";a.click()}
const SB_URL="https://egofegvubhprvzlhptvb.supabase.co",SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnb2ZlZ3Z1YmhwcnZ6bGhwdHZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MTQ5NDMsImV4cCI6MjEwNzE5MDk0M30.tfVjmO_rIvKhonmj4rDiRnkXF2C1lI1LAPTsCqvB1MA";
const sb=supabase.createClient(SB_URL,SB_KEY);let me=null;
function loginUI(msg){$("#nav").innerHTML="";$("#main").innerHTML=`<div class="card" style="max-width:380px;margin:60px auto"><h2>Galleria 40 – تسجيل الدخول</h2><label>البريد الإلكتروني</label><input id="l_e" type="email" dir="ltr"><div style="height:10px"></div><label>كلمة المرور</label><input id="l_p" type="password" dir="ltr"><p style="color:#c0392b">${msg||""}</p><button class="btn" onclick="login()">دخول</button></div>`}
async function login(){const r=await sb.auth.signInWithPassword({email:$("#l_e").value.trim(),password:$("#l_p").value});if(r.error)return loginUI("بيانات الدخول غير صحيحة");boot()}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return loginUI();
const p=await sb.from("profiles").select("*").eq("id",session.user.id).single();me=p.data;if(!me||!me.active){await sb.auth.signOut();return loginUI("الحساب غير مفعّل")}
user={id:async()=>session.user.id};isMgmt=me.role=="admin";nav();render()}
function out(){sb.auth.signOut().then(()=>location.reload())}
boot();
</script></body></html>
